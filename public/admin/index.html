<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#06063a">
<title>Panel · Ichiro Sushiya</title>
<link rel="icon" href="/favicon.ico?v=2" sizes="48x48">
<link rel="icon" href="/favicon-32.png?v=2" sizes="32x32" type="image/png">
<link rel="icon" href="/icon-192.png?v=2" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<meta property="og:title" content="Panel · Ichiro Sushiya">
<meta property="og:description" content="Panel de administración de Ichiro Sushiya.">
<meta property="og:image" content="https://ichirosushiya.com.ar/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- Entrar -->
<main class="login" id="login">
  <form id="login-form">
    <div class="koi" aria-hidden="true"></div>
    <h1>Ichiro Sushiya</h1>
    <p>Panel de administración</p>
    <label>Contraseña<input type="password" id="login-clave" autocomplete="current-password" required autofocus></label>
    <label class="check"><input type="checkbox" id="login-recordar" checked> Recordar en este dispositivo</label>
    <p class="error" id="login-error" hidden></p>
    <button class="btn primario" type="submit">Entrar</button>
  </form>
</main>

<!-- Panel -->
<div class="app" id="app" hidden>
  <header class="barra">
    <div class="marca"><span class="koi chico" aria-hidden="true"></span><b>Ichiro</b> <span>Panel</span></div>
    <nav class="tabs" id="tabs" aria-label="Secciones">
      <button data-tab="pedidos" aria-current="page">Pedidos <span class="badge" id="badge" hidden></span></button>
      <button data-tab="dia">Stock del día</button>
      <button data-tab="carta">Carta</button>
      <button data-tab="ajustes">Ajustes</button>
    </nav>
    <button class="salir" id="salir">Salir</button>
  </header>

  <!-- Interruptores de pedidos, siempre a mano -->
  <div class="interruptores" id="interruptores"></div>

  <section class="vista" id="v-pedidos">
    <div class="filtros" id="filtros">
      <button data-f="activos" aria-pressed="true">Activos</button>
      <button data-f="pendiente" aria-pressed="false">Pendientes</button>
      <button data-f="confirmado" aria-pressed="false">Confirmados</button>
      <button data-f="cerrados" aria-pressed="false">Entregados y cancelados</button>
    </div>
    <div id="pedidos-lista" class="pedidos"></div>
  </section>

  <section class="vista" id="v-dia" hidden>
    <div class="dias" id="dia-fechas"></div>
    <div class="panel-caja">
      <div class="caja-head">
        <div><h2 id="dia-titulo"></h2><p class="sub" id="dia-sub"></p></div>
        <div class="copiar"><select id="dia-copiar-desde" aria-label="Copiar desde"></select><button class="btn" id="dia-copiar">Copiar</button></div>
      </div>
      <div id="dia-lista"></div>
      <div class="acciones-pie"><button class="btn primario" id="dia-guardar">Guardar el día</button></div>
    </div>
  </section>

  <section class="vista" id="v-carta" hidden>
    <div class="caja-head">
      <p class="sub">Tocá el precio para cambiarlo. Lo que está desactivado no aparece en la web.</p>
      <button class="btn primario" id="nueva-categoria">+ Categoría</button>
    </div>
    <div id="carta-lista"></div>
  </section>

  <section class="vista" id="v-ajustes" hidden>
    <form id="ajustes-form" class="ajustes"></form>
  </section>
</div>

<!-- Editar producto o categoría -->
<dialog class="dlg" id="dlg">
  <form id="dlg-form" method="dialog">
    <h2 id="dlg-titulo"></h2>
    <div id="dlg-campos"></div>
    <p class="error" id="dlg-error" hidden></p>
    <div class="dlg-pie">
      <button type="button" class="btn peligro" id="dlg-borrar">Borrar</button>
      <span></span>
      <button type="button" class="btn" id="dlg-cancelar">Cancelar</button>
      <button type="submit" class="btn primario">Guardar</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>
<script src="admin.js"></script>
</body>
</html>
